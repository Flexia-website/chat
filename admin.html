<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flexia Admin Panel</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
    --primary: #4361ee;
    --primary-light: #4895ef;
    --primary-dark: #3a0ca3;
    --secondary: #7209b7;
    --accent: #f72585;
    --success: #4cc9f0;
    --warning: #f8961e;
    --danger: #ef233c;
    --light: #f8f9fa;
    --dark: #212529;
    --gray: #6c757d;
    --gray-light: #e9ecef;
    --glass-bg: rgba(255, 255, 255, 0.7);
    --glass-border: rgba(255, 255, 255, 0.18);
    --shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
    --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.05);
    --radius: 16px;
    --radius-sm: 10px;
    --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    color: var(--dark);
    -webkit-font-smoothing: antialiased;
    padding: 16px;
}

.admin-container {
    max-width: 1400px;
    margin: 0 auto;
}

/* Header */
.admin-header {
    background: var(--glass-bg);
    backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius);
    padding: 24px;
    margin-bottom: 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: var(--shadow);
}

.admin-header h1 {
    font-size: 28px;
    font-weight: 700;
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}

.header-actions {
    display: flex;
    gap: 12px;
    align-items: center;
}

.status-badge {
    padding: 8px 16px;
    background: var(--success);
    color: white;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 6px;
}

.status-badge.offline {
    background: var(--danger);
}

.btn {
    padding: 10px 20px;
    border: none;
    border-radius: var(--radius-sm);
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: var(--transition);
    display: flex;
    align-items: center;
    gap: 8px;
    white-space: nowrap;
}

.btn-primary {
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: white;
    box-shadow: var(--shadow-sm);
}

.btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow);
}

.btn-secondary {
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    color: var(--primary);
}

.btn-secondary:hover {
    background: rgba(255, 255, 255, 0.9);
}

.btn-danger {
    background: var(--danger);
    color: white;
}

.btn-danger:hover {
    background: #d41b35;
}

.btn-sm {
    padding: 6px 12px;
    font-size: 12px;
}

/* Main Layout */
.admin-layout {
    display: grid;
    grid-template-columns: 1fr 2fr;
    gap: 24px;
}

/* Users List */
.users-panel {
    background: var(--glass-bg);
    backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    max-height: 600px;
}

.panel-header {
    padding: 16px;
    border-bottom: 1px solid rgba(0, 0, 0, 0.05);
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.panel-header h2 {
    font-size: 16px;
    font-weight: 600;
}

.panel-header .badge {
    background: var(--primary);
    color: white;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 12px;
}

.users-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
}

.user-item {
    padding: 12px;
    margin-bottom: 8px;
    background: rgba(255, 255, 255, 0.5);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: var(--transition);
}

.user-item:hover {
    background: rgba(255, 255, 255, 0.8);
    border-color: var(--primary);
}

.user-item.active {
    background: linear-gradient(135deg, rgba(67, 97, 238, 0.1), rgba(58, 12, 163, 0.1));
    border-color: var(--primary);
}

.user-name {
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 4px;
}

.user-status {
    font-size: 11px;
    color: var(--gray);
    display: flex;
    align-items: center;
    gap: 4px;
}

.user-status .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--danger);
}

.user-status .dot.online {
    background: var(--success);
}

.user-meta {
    font-size: 10px;
    color: var(--gray);
    margin-top: 6px;
    display: flex;
    justify-content: space-between;
}

/* Chat Panel */
.chat-panel {
    background: var(--glass-bg);
    backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    max-height: 600px;
    overflow: hidden;
}

.chat-header {
    padding: 16px;
    border-bottom: 1px solid rgba(0, 0, 0, 0.05);
}

.chat-header h3 {
    font-size: 14px;
    font-weight: 600;
}

.chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.no-user-selected {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: var(--gray);
}

.no-user-selected i {
    font-size: 48px;
    margin-bottom: 12px;
    opacity: 0.3;
}

.chat-message {
    padding: 10px 12px;
    border-radius: 10px;
    font-size: 13px;
    max-width: 85%;
    word-wrap: break-word;
}

.chat-message.user {
    align-self: flex-start;
    background: rgba(100, 100, 100, 0.1);
    border: 1px solid var(--glass-border);
}

.chat-message.admin {
    align-self: flex-end;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: white;
}

.chat-message.auto-reply {
    opacity: 0.7;
    font-style: italic;
}

.message-time {
    font-size: 10px;
    opacity: 0.6;
    margin-top: 4px;
}

.chat-input-area {
    padding: 12px;
    border-top: 1px solid rgba(0, 0, 0, 0.05);
    display: flex;
    gap: 8px;
}

.chat-input {
    flex: 1;
    padding: 10px 12px;
    border: 1px solid var(--glass-border);
    border-radius: var(--radius-sm);
    background: rgba(255, 255, 255, 0.8);
    font-family: inherit;
    font-size: 13px;
    resize: none;
    max-height: 100px;
}

.chat-input:focus {
    outline: none;
    border-color: var(--primary);
    background: white;
}

.chat-send-btn {
    width: 36px;
    height: 36px;
    padding: 0;
}

/* Settings Panel */
.settings-panel {
    grid-column: 1 / -1;
    background: var(--glass-bg);
    backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 24px;
}

.settings-panel h3 {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 16px;
}

.auto-replies {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 16px;
    margin-bottom: 24px;
}

.reply-card {
    padding: 14px;
    background: rgba(255, 255, 255, 0.5);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius-sm);
    transition: var(--transition);
}

.reply-card:hover {
    background: rgba(255, 255, 255, 0.8);
}

.reply-text {
    font-size: 13px;
    margin-bottom: 10px;
    line-height: 1.5;
}

.reply-actions {
    display: flex;
    gap: 6px;
}

.reply-actions button {
    flex: 1;
}

.add-reply-form {
    display: grid;
    grid-template-columns: 1fr 100px;
    gap: 12px;
    align-items: flex-end;
}

.form-group {
    display: flex;
    flex-direction: column;
}

.form-group label {
    font-size: 12px;
    font-weight: 600;
    margin-bottom: 6px;
}

.form-group textarea {
    padding: 10px 12px;
    border: 1px solid var(--glass-border);
    border-radius: var(--radius-sm);
    background: rgba(255, 255, 255, 0.8);
    font-family: inherit;
    font-size: 13px;
    resize: vertical;
    min-height: 60px;
}

.form-group textarea:focus {
    outline: none;
    border-color: var(--primary);
    background: white;
}

/* Modal */
.modal {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(4px);
    z-index: 1000;
    align-items: center;
    justify-content: center;
}

.modal.active {
    display: flex;
}

.modal-content {
    background: var(--glass-bg);
    backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius);
    padding: 24px;
    max-width: 400px;
    box-shadow: var(--shadow);
}

.modal-close {
    position: absolute;
    top: 16px;
    right: 16px;
    background: none;
    border: none;
    font-size: 24px;
    cursor: pointer;
    color: var(--gray);
}

/* Responsive */
@media (max-width: 1024px) {
    .admin-layout {
        grid-template-columns: 1fr;
    }
    
    .users-panel,
    .chat-panel {
        max-height: none;
        height: 400px;
    }
}

@media (max-width: 768px) {
    .admin-header {
        flex-direction: column;
        gap: 16px;
    }
    
    .auto-replies {
        grid-template-columns: 1fr;
    }
}

/* Scrollbar */
::-webkit-scrollbar {
    width: 6px;
    height: 6px;
}

::-webkit-scrollbar-track {
    background: transparent;
}

::-webkit-scrollbar-thumb {
    background: rgba(0, 0, 0, 0.1);
    border-radius: 3px;
}

::-webkit-scrollbar-thumb:hover {
    background: rgba(0, 0, 0, 0.15);
}

/* Toast */
.toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    padding: 14px 20px;
    background: var(--glass-bg);
    backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius-sm);
    font-size: 13px;
    box-shadow: var(--shadow);
    animation: slideInUp 0.3s ease;
    z-index: 2000;
}

@keyframes slideInUp {
    from {
        transform: translateY(20px);
        opacity: 0;
    }
    to {
        transform: translateY(0);
        opacity: 1;
    }
}

.toast.success {
    border-left: 4px solid var(--success);
}

.toast.error {
    border-left: 4px solid var(--danger);
}
</style>
</head>
<body>
<div class="admin-container">
    <!-- Header -->
    <div class="admin-header">
        <div>
            <h1>👨‍💼 Admin Dashboard</h1>
        </div>
        <div class="header-actions">
            <div class="status-badge" id="statusBadge">
                <i class="fas fa-dot-circle"></i>
                <span>Connected</span>
            </div>
            <button class="btn btn-secondary" id="settingsBtn">
                <i class="fas fa-cog"></i> Settings
            </button>
            <button class="btn btn-secondary" id="logoutBtn">
                <i class="fas fa-sign-out-alt"></i> Logout
            </button>
        </div>
    </div>

    <!-- Main Layout -->
    <div class="admin-layout">
        <!-- Users List -->
        <div class="users-panel">
            <div class="panel-header">
                <h2>Users</h2>
                <div class="badge" id="userCount">0</div>
            </div>
            <div class="users-list" id="usersList">
                <div style="padding: 20px; text-align: center; color: var(--gray);">
                    <p>Loading users...</p>
                </div>
            </div>
        </div>

        <!-- Chat Panel -->
        <div class="chat-panel">
            <div class="chat-header">
                <h3 id="selectedUserName">Select a user to chat</h3>
            </div>
            <div class="chat-messages" id="chatMessages">
                <div class="no-user-selected">
                    <i class="fas fa-inbox"></i>
                    <p>No user selected</p>
                </div>
            </div>
            <div class="chat-input-area" id="chatInputArea" style="display: none;">
                <textarea class="chat-input" id="replyInput" placeholder="Type your reply..." rows="2"></textarea>
                <button class="btn btn-primary chat-send-btn" id="sendReplyBtn">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Settings Panel -->
    <div class="settings-panel" id="settingsPanel" style="display: none;">
        <h3>⚙️ Auto-Reply Settings</h3>
        <p style="font-size: 12px; color: var(--gray); margin-bottom: 16px;">
            Set up automatic replies for first-time messages. The app will randomly select one of these responses.
        </p>
        
        <div class="auto-replies" id="repliesList">
            <div style="text-align: center; color: var(--gray); grid-column: 1 / -1;">
                <p>Loading replies...</p>
            </div>
        </div>

        <div style="padding: 16px; background: rgba(255, 255, 255, 0.3); border-radius: var(--radius-sm); border: 1px solid var(--glass-border);">
            <h4 style="font-size: 13px; font-weight: 600; margin-bottom: 12px;">Add New Auto-Reply</h4>
            <div class="add-reply-form">
                <div class="form-group">
                    <label>Reply Message</label>
                    <textarea id="newReplyText" placeholder="Enter auto-reply message..." rows="2"></textarea>
                </div>
                <button class="btn btn-primary" id="addReplyBtn" style="flex: 0 0 auto;">
                    <i class="fas fa-plus"></i> Add
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Modal -->
<div class="modal" id="confirmModal">
    <div class="modal-content">
        <button class="modal-close" id="modalClose">&times;</button>
        <h3 id="modalTitle" style="margin-bottom: 16px;"></h3>
        <p id="modalMessage" style="margin-bottom: 24px; font-size: 13px;"></p>
        <div style="display: flex; gap: 8px;">
            <button class="btn btn-secondary" id="modalCancel" style="flex: 1;">Cancel</button>
            <button class="btn btn-danger" id="modalConfirm" style="flex: 1;">Delete</button>
        </div>
    </div>
</div>

<script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
<script>
    // Initialize admin
    const socket = io();
    let selectedUser = null;
    let users = [];
    let autReplies = [];
    let adminDeviceId = localStorage.getItem('adminDeviceId') || generateAdminDeviceId();
    
    function generateAdminDeviceId() {
        const id = 'admin-' + Math.random().toString(36).substr(2, 9);
        localStorage.setItem('adminDeviceId', id);
        return id;
    }

    // Request notification permission
    if ('Notification' in window && Notification.permission === 'default') {
        Notification.requestPermission();
    }

    // Socket Events
    socket.on('connect', () => {
        console.log('✅ Admin connected');
        console.log(`📱 Admin Device ID: ${adminDeviceId}`);
        updateStatus(true);
        
        // Authenticate with password from URL
        const urlParts = window.location.pathname.split('/');
        const adminPassword = urlParts[urlParts.length - 1];
        
        if (adminPassword) {
            socket.emit('admin_auth', {
                password: adminPassword,
                device_id: adminDeviceId
            });
        }
        
        loadUsers();
        loadAutoReplies();
    });

    socket.on('disconnect', () => {
        console.log('❌ Admin disconnected');
        updateStatus(false);
    });

    socket.on('users_list', (data) => {
        users = data.users;
        displayUsers(users);
        document.getElementById('userCount').textContent = users.length;
    });

    socket.on('user_messages', (data) => {
        displayChat(data);
    });

    socket.on('new_user_message', (data) => {
        if (selectedUser && selectedUser.device_id === data.device_id) {
            addChatMessage(data);
        }
        
        // Notify admin
        if (Notification.permission === 'granted') {
            new Notification('New Message', {
                body: `${data.sender}: ${data.message.substring(0, 50)}`,
                tag: 'new-message',
                requireInteraction: true
            });
        }
    });

    socket.on('admin_auth_response', (data) => {
        if (!data.success) {
            showToast('Authentication failed', 'error');
            setTimeout(() => window.location.href = '/', 2000);
        }
    });

    // UI Functions
    function updateStatus(connected) {
        const badge = document.getElementById('statusBadge');
        if (connected) {
            badge.classList.remove('offline');
            badge.innerHTML = '<i class="fas fa-dot-circle"></i><span>Connected</span>';
        } else {
            badge.classList.add('offline');
            badge.innerHTML = '<i class="fas fa-dot-circle"></i><span>Disconnected</span>';
        }
    }

    function displayUsers(usersList) {
        const container = document.getElementById('usersList');
        
        if (usersList.length === 0) {
            container.innerHTML = '<div style="padding: 20px; text-align: center; color: var(--gray);">No users yet</div>';
            return;
        }

        container.innerHTML = usersList.map(user => `
            <div class="user-item ${selectedUser?.device_id === user.device_id ? 'active' : ''}" 
                 onclick="selectUser('${user.device_id}')">
                <div class="user-name">${escapeHtml(user.username)}</div>
                <div class="user-status">
                    <span class="dot ${user.is_connected ? 'online' : ''}"></span>
                    ${user.is_connected ? 'Online' : 'Offline'}
                </div>
                <div class="user-meta">
                    <span>${user.message_count} messages</span>
                    <span>${Math.round(user.inactive_hours)}h ago</span>
                </div>
            </div>
        `).join('');
    }

    function selectUser(deviceId) {
        selectedUser = users.find(u => u.device_id === deviceId);
        if (selectedUser) {
            socket.emit('get_user_messages', { device_id: deviceId });
            document.getElementById('selectedUserName').textContent = selectedUser.username || 'Anonymous';
            document.getElementById('chatInputArea').style.display = 'flex';
            displayUsers(users); // Refresh to show active state
        }
    }

    function displayChat(data) {
        const container = document.getElementById('chatMessages');
        container.innerHTML = '';

        data.messages.forEach(msg => {
            addChatMessage(msg);
        });

        container.scrollTop = container.scrollHeight;
    }

    function addChatMessage(msg) {
        const container = document.getElementById('chatMessages');
        if (!container.querySelector('.no-user-selected')) {
            const msgEl = document.createElement('div');
            msgEl.className = `chat-message ${msg.is_admin ? 'admin' : 'user'} ${msg.is_auto_reply ? 'auto-reply' : ''}`;
            
            const time = new Date(msg.timestamp).toLocaleTimeString('en-US', {
                hour: '2-digit',
                minute: '2-digit'
            });

            msgEl.innerHTML = `
                <div>${escapeHtml(msg.message)}</div>
                <div class="message-time">${time}</div>
            `;

            container.appendChild(msgEl);
            container.scrollTop = container.scrollHeight;
        }
    }

    function displayChat(data) {
        const container = document.getElementById('chatMessages');
        container.innerHTML = data.messages.map(msg => {
            const time = new Date(msg.timestamp).toLocaleTimeString('en-US', {
                hour: '2-digit',
                minute: '2-digit'
            });

            return `
                <div class="chat-message ${msg.is_admin ? 'admin' : 'user'} ${msg.is_auto_reply ? 'auto-reply' : ''}">
                    <div>${escapeHtml(msg.message)}</div>
                    <div class="message-time">${time}</div>
                </div>
            `;
        }).join('');

        container.scrollTop = container.scrollHeight;
    }

    function loadAutoReplies() {
        fetch('/admin/settings', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: 'get_replies' })
        })
        .then(r => r.json())
        .then(data => {
            autoReplies = data.replies || [];
            displayAutoReplies();
        });
    }

    function displayAutoReplies() {
        const container = document.getElementById('repliesList');
        
        if (autoReplies.length === 0) {
            container.innerHTML = '<div style="text-align: center; color: var(--gray); grid-column: 1 / -1;">No auto-replies yet</div>';
            return;
        }

        container.innerHTML = autoReplies.map(reply => `
            <div class="reply-card">
                <div class="reply-text">"${escapeHtml(reply.text)}"</div>
                <div class="reply-actions">
                    <button class="btn btn-sm btn-danger" onclick="deleteReply(${reply.id})">
                        <i class="fas fa-trash"></i> Delete
                    </button>
                </div>
            </div>
        `).join('');
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    function showToast(message, type = 'info') {
        const toast = document.createElement('div');
        toast.className = `toast ${type}`;
        toast.textContent = message;
        document.body.appendChild(toast);

        setTimeout(() => {
            toast.remove();
        }, 3000);
    }

    // Event Listeners
    document.getElementById('sendReplyBtn').addEventListener('click', () => {
        const message = document.getElementById('replyInput').value.trim();
        if (!message || !selectedUser) return;

        socket.emit('admin_send_message', {
            device_id: selectedUser.device_id,
            message: message
        });

        document.getElementById('replyInput').value = '';
        showToast('Message sent', 'success');
    });

    document.getElementById('addReplyBtn').addEventListener('click', () => {
        const text = document.getElementById('newReplyText').value.trim();
        if (!text) return;

        fetch('/admin/settings', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: 'add_reply', reply_text: text })
        })
        .then(r => r.json())
        .then(data => {
            if (data.success) {
                document.getElementById('newReplyText').value = '';
                loadAutoReplies();
                showToast('Auto-reply added', 'success');
            }
        });
    });

    document.getElementById('logoutBtn').addEventListener('click', () => {
        localStorage.removeItem('adminToken');
        window.location.href = '/';
    });

    document.getElementById('settingsBtn').addEventListener('click', () => {
        const panel = document.getElementById('settingsPanel');
        panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
    });

    // Load initial data
    function loadUsers() {
        socket.emit('get_all_users', {});
    }

    // Refresh users every 5 seconds
    setInterval(loadUsers, 5000);

    console.log('🚀 Admin panel initialized');
</script>
</body>
</html>
