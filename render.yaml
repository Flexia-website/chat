services:
  - type: web
    name: flexia-chat
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    healthCheckPath: /
    autoDeploy: true
    
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        value: change-me-in-production-${RENDER_INSTANCE_ID}
      - key: ADMIN_PASSWORD
        value: your-admin-password-here
        isFile: false
      - key: VAPID_PUBLIC_KEY
        value: generate-your-own-see-readme
        isFile: false
      - key: VAPID_PRIVATE_KEY
        value: generate-your-own-see-readme
        isFile: false
      - key: VAPID_CLAIMS_EMAIL
        value: mailto:you@example.com
        isFile: false
      # Not set by default — the app runs on local SQLite until you add this.
      # Create a Postgres database on Render, then set this env var (either
      # paste its connection string, or add a `databases:` block below and
      # point here with fromDatabase) to switch storage over.
      # - key: DATABASE_URL
      #   fromDatabase:
      #     name: flexia-chat-db
      #     property: connectionString
