services:
  - type: web
    name: flexia-chat
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    healthCheckPath: /
    autoDeploy: true
    
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        value: change-me-in-production-${RENDER_INSTANCE_ID}
      - key: ADMIN_PASSWORD
        value: your-admin-password-here
        isFile: false
