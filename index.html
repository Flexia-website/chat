<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0">
<meta name="theme-color" content="#0E1013">
<title>Support</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
    --ink: #0E1013;
    --ink-soft: #171A1F;
    --ink-line: rgba(255, 255, 255, 0.08);
    --bone: #FAF8F4;
    --bone-dim: #EFEBE2;
    --paper: #F4F1EA;
    --brass: #B8925A;
    --brass-bright: #D9B27C;
    --signal: #3ECF8E;
    --danger: #E15252;
    --text-soft: rgba(14, 16, 19, 0.55);
    --shadow-lg: 0 24px 60px rgba(10, 11, 14, 0.35);
    --shadow-sm: 0 2px 10px rgba(10, 11, 14, 0.08);
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
    height: 100%;
    overscroll-behavior: none;
}

body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background:
        radial-gradient(120% 100% at 15% 0%, #23262c 0%, var(--ink) 55%),
        var(--ink);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

/* ===== App Shell ===== */
.chat-app {
    width: 100%;
    max-width: 428px;
    height: 100dvh;
    background: var(--bone);
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
}

@media (min-width: 641px) {
    body { padding: 32px; }
    .chat-app {
        height: min(760px, 92dvh);
        max-height: 92dvh;
        border-radius: 26px;
        box-shadow: var(--shadow-lg);
        border: 1px solid rgba(255, 255, 255, 0.06);
        animation: riseIn 0.5s var(--ease);
    }
}

@keyframes riseIn {
    from { opacity: 0; transform: translateY(18px) scale(0.99); }
    to { opacity: 1; transform: translateY(0) scale(1); }
}

/* ===== Header ===== */
.chat-header {
    background: var(--ink);
    color: var(--bone);
    padding: 18px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
    position: relative;
}

.chat-header::after {
    content: '';
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--brass) 35%, var(--brass-bright) 50%, var(--brass) 65%, transparent);
    opacity: 0.7;
}

.avatar {
    width: 40px;
    height: 40px;
    border-radius: 12px;
    background: linear-gradient(155deg, var(--ink-soft), #24282f);
    border: 1px solid var(--ink-line);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    color: var(--brass-bright);
    flex-shrink: 0;
}

.title-section { flex: 1; min-width: 0; }

.title-section h1 {
    font-family: 'Manrope', sans-serif;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.1px;
}

.title-section p {
    font-size: 12px;
    color: rgba(250, 248, 244, 0.55);
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 2px;
}

.status-indicator {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--danger);
    flex-shrink: 0;
    transition: background 0.3s var(--ease);
}

.status-indicator.connected {
    background: var(--signal);
    box-shadow: 0 0 0 3px rgba(62, 207, 142, 0.18);
}

.notification-badge {
    width: 22px;
    height: 22px;
    background: var(--danger);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 700;
    color: white;
    opacity: 0;
    transform: scale(0);
    transition: all 0.25s var(--ease);
}

.notification-badge.active { opacity: 1; transform: scale(1); }

/* ===== Messages ===== */
.messages-container {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    background: var(--paper);
    scroll-behavior: smooth;
}

.messages-container::-webkit-scrollbar { width: 4px; }
.messages-container::-webkit-scrollbar-track { background: transparent; }
.messages-container::-webkit-scrollbar-thumb { background: rgba(14, 16, 19, 0.15); border-radius: 2px; }

.message {
    display: flex;
    flex-direction: column;
    margin-bottom: 12px;
    animation: msgIn 0.28s var(--ease);
    max-width: 78%;
}

@keyframes msgIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
}

.message.user { align-self: flex-end; align-items: flex-end; }
.message.admin { align-self: flex-start; align-items: flex-start; }

.message-content {
    padding: 11px 14px;
    border-radius: 16px;
    word-wrap: break-word;
    line-height: 1.45;
    font-size: 14px;
}

.message.user .message-content {
    background: var(--ink);
    color: var(--bone);
    border-radius: 16px 4px 16px 16px;
}

.message.admin .message-content {
    background: #FFFFFF;
    color: var(--ink);
    border: 1px solid rgba(14, 16, 19, 0.06);
    box-shadow: var(--shadow-sm);
    border-radius: 4px 16px 16px 16px;
}

.message-content.image { padding: 4px; border-radius: 14px; }
.message-content.image img {
    display: block;
    max-width: 100%;
    max-height: 220px;
    border-radius: 11px;
    cursor: zoom-in;
}

.typing-row { align-self: flex-start; margin-bottom: 12px; }
.typing-bubble {
    background: #FFFFFF;
    border: 1px solid rgba(14, 16, 19, 0.06);
    box-shadow: var(--shadow-sm);
    border-radius: 4px 16px 16px 16px;
    padding: 12px 16px;
    display: inline-flex;
    gap: 4px;
    align-items: center;
}
.typing-bubble span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--text-soft);
    animation: typingBounce 1.2s infinite ease-in-out;
}
.typing-bubble span:nth-child(2) { animation-delay: 0.15s; }
.typing-bubble span:nth-child(3) { animation-delay: 0.3s; }
@keyframes typingBounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-4px); opacity: 1; }
}

.message-time {
    font-size: 10px;
    color: var(--text-soft);
    margin-top: 4px;
    padding: 0 4px;
}

/* ===== Input Area ===== */
.input-area {
    border-top: 1px solid rgba(14, 16, 19, 0.08);
    padding: 12px 14px;
    padding-bottom: max(12px, env(safe-area-inset-bottom));
    background: var(--bone);
    display: flex;
    gap: 8px;
    align-items: center;
    flex-shrink: 0;
}

.input-group {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--bone-dim);
    border: 1px solid rgba(14, 16, 19, 0.07);
    border-radius: 24px;
    padding: 4px 4px 4px 16px;
    transition: border-color 0.2s var(--ease), background 0.2s var(--ease);
}

.input-group:focus-within {
    border-color: var(--brass);
    background: #FFFFFF;
}

.message-input {
    flex: 1;
    border: none;
    background: transparent;
    font-family: inherit;
    font-size: 14px;
    padding: 8px 0;
    outline: none;
    color: var(--ink);
}

.message-input::placeholder { color: var(--text-soft); }

.input-btn {
    width: 34px;
    height: 34px;
    border: none;
    border-radius: 50%;
    background: transparent;
    color: var(--text-soft);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    flex-shrink: 0;
    transition: all 0.2s var(--ease);
}

.input-btn:hover { color: var(--ink); background: rgba(14, 16, 19, 0.06); }

.send-btn {
    width: 42px;
    height: 42px;
    border: none;
    border-radius: 50%;
    background: var(--ink);
    color: var(--brass-bright);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    flex-shrink: 0;
    transition: transform 0.15s var(--ease), box-shadow 0.15s var(--ease);
    box-shadow: 0 4px 14px rgba(14, 16, 19, 0.25);
}

.send-btn:hover { transform: translateY(-1px); }
.send-btn:active { transform: translateY(0) scale(0.96); }
.send-btn:disabled { opacity: 0.4; cursor: default; transform: none; }

/* ===== Empty State ===== */
.empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    padding: 24px;
    text-align: center;
    color: var(--text-soft);
}

.empty-state .empty-icon {
    width: 56px;
    height: 56px;
    border-radius: 16px;
    background: var(--bone-dim);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    color: var(--brass);
    margin-bottom: 14px;
}

.empty-state h3 {
    font-family: 'Manrope', sans-serif;
    font-size: 15px;
    margin-bottom: 6px;
    font-weight: 700;
    color: var(--ink);
}

.empty-state p { font-size: 12.5px; max-width: 220px; line-height: 1.5; }

#imageInput { display: none; }

/* ===== Small screens: true full-bleed, no scroll on body ===== */
@media (max-width: 640px) {
    body { padding: 0; }
    .chat-app { max-width: none; width: 100vw; height: 100dvh; }
}
</style>
</head>
<body>
<div class="chat-app">
    <div class="chat-header">
        <div class="avatar"><i class="fa-solid fa-headset"></i></div>
        <div class="title-section">
            <h1>Support</h1>
            <p><span class="status-indicator" id="statusDot"></span><span id="status">Connecting</span></p>
        </div>
        <div class="notification-badge" id="notificationBadge">
            <span id="notificationCount">1</span>
        </div>
    </div>

    <div class="messages-container" id="messagesContainer">
        <div class="empty-state">
            <div class="empty-icon"><i class="fa-regular fa-comments"></i></div>
            <h3>Start a conversation</h3>
            <p>Send a message and our team will get back to you shortly.</p>
        </div>
    </div>

    <div class="input-area">
        <div class="input-group">
            <input
                type="text"
                class="message-input"
                id="messageInput"
                placeholder="Message"
                autocomplete="off"
            >
            <button class="input-btn" id="imageBtn" title="Send image">
                <i class="fa-regular fa-image"></i>
            </button>
        </div>
        <button class="send-btn" id="sendBtn" title="Send message">
            <i class="fa-solid fa-arrow-up"></i>
        </button>
    </div>
</div>

<input type="file" id="imageInput" accept="image/*">

<script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
<script>
    const socket = io();
    let deviceId = localStorage.getItem('deviceId') || generateUUID();
    let messageCount = 0;
    let isConnected = false;

    if ('Notification' in window && Notification.permission === 'default') {
        Notification.requestPermission();
    }

    function generateUUID() {
        return 'device-' + Math.random().toString(36).substr(2, 9);
    }

    function saveDeviceId() {
        localStorage.setItem('deviceId', deviceId);
    }

    socket.on('connect', () => {
        isConnected = true;
        updateStatus('Online', true);
        socket.emit('join', { device_id: deviceId, username: 'User' });
        saveDeviceId();
    });

    socket.on('disconnect', () => {
        isConnected = false;
        updateStatus('Offline', false);
    });

    socket.on('user_data', (data) => {
        deviceId = data.device_id;
        saveDeviceId();
        // Load this device's own conversation history (persists up to 2 days)
        socket.emit('get_my_messages', { device_id: deviceId });
    });

    socket.on('my_messages', (data) => {
        if (data.device_id !== deviceId) return;
        data.messages.forEach(displayMessage);
    });

    let unreadCount = 0;

    socket.on('receive_message', (data) => {
        displayMessage(data);

        if (data.is_admin) {
            if (document.visibilityState !== 'visible') {
                unreadCount++;
                updateBadge();
                if (Notification.permission === 'granted') {
                    new Notification('Support', {
                        body: data.message.substring(0, 100),
                        tag: 'support-chat',
                        requireInteraction: false
                    });
                }
            }
        }
    });

    document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') {
            unreadCount = 0;
            updateBadge();
        }
    });

    function updateBadge() {
        const badge = document.getElementById('notificationBadge');
        document.getElementById('notificationCount').textContent = unreadCount;
        badge.classList.toggle('active', unreadCount > 0);
    }

    socket.on('error', (error) => {
        console.error('Error:', error);
        showToast(error.message, 'error');
    });

    socket.on('heartbeat_ack', () => {});

    function updateStatus(text, connected) {
        document.getElementById('status').textContent = text;
        const dot = document.getElementById('statusDot');
        dot.classList.toggle('connected', connected);
    }

    socket.on('typing', (data) => showTyping());
    socket.on('stop_typing', (data) => hideTyping());

    function showTyping() {
        hideTyping();
        const container = document.getElementById('messagesContainer');
        const emptyState = container.querySelector('.empty-state');
        if (emptyState) emptyState.remove();
        const row = document.createElement('div');
        row.className = 'message admin typing-row';
        row.id = 'typingRow';
        row.innerHTML = `<div class="typing-bubble"><span></span><span></span><span></span></div>`;
        container.appendChild(row);
        container.scrollTop = container.scrollHeight;
    }

    function hideTyping() {
        const row = document.getElementById('typingRow');
        if (row) row.remove();
    }

    function displayMessage(data) {
        hideTyping();
        const container = document.getElementById('messagesContainer');

        const emptyState = container.querySelector('.empty-state');
        if (emptyState) emptyState.remove();

        const messageEl = document.createElement('div');
        messageEl.className = `message ${data.is_admin ? 'admin' : 'user'}`;

        let contentHTML = '';
        if (data.type === 'image') {
            contentHTML = `<div class="message-content image">
                <img src="${data.message}" alt="Image" loading="lazy">
            </div>`;
        } else {
            contentHTML = `<div class="message-content">
                ${escapeHtml(data.message)}
            </div>`;
        }

        const timeStr = new Date(data.timestamp).toLocaleTimeString('en-US', {
            hour: '2-digit',
            minute: '2-digit'
        });

        messageEl.innerHTML = contentHTML + `<div class="message-time">${timeStr}</div>`;
        container.appendChild(messageEl);

        container.scrollTop = container.scrollHeight;
        messageCount++;
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    function showToast(message, type = 'info') {
        console.log(`[${type.toUpperCase()}] ${message}`);
    }

    const sendBtn = document.getElementById('sendBtn');
    const messageInput = document.getElementById('messageInput');
    const imageBtn = document.getElementById('imageBtn');
    const imageInput = document.getElementById('imageInput');

    sendBtn.addEventListener('click', sendMessage);
    messageInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });

    imageBtn.addEventListener('click', () => imageInput.click());
    imageInput.addEventListener('change', handleImageUpload);

    function sendMessage() {
        const message = messageInput.value.trim();
        if (!message) return;

        socket.emit('send_message', {
            device_id: deviceId,
            sender: 'User',
            message: message,
            type: 'text'
        });

        messageInput.value = '';
    }

    function handleImageUpload(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
            socket.emit('upload_image', {
                device_id: deviceId,
                image_data: event.target.result,
                is_admin: false
            });
            imageInput.value = '';
        };
        reader.readAsDataURL(file);
    }

    setInterval(() => {
        if (isConnected) {
            socket.emit('heartbeat', { device_id: deviceId });
        }
    }, 30000);
</script>
</body>
</html>
