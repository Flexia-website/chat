<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flexia • Support Chat</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
    --primary: #4361ee;
    --primary-light: #4895ef;
    --primary-dark: #3a0ca3;
    --secondary: #7209b7;
    --accent: #f72585;
    --success: #4cc9f0;
    --warning: #f8961e;
    --danger: #ef233c;
    --light: #f8f9fa;
    --dark: #212529;
    --gray: #6c757d;
    --gray-light: #e9ecef;
    --glass-bg: rgba(255, 255, 255, 0.7);
    --glass-border: rgba(255, 255, 255, 0.18);
    --shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
    --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.05);
    --radius: 16px;
    --radius-sm: 10px;
    --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 12px;
    color: var(--dark);
    -webkit-font-smoothing: antialiased;
}

/* Main Chat Container */
.chat-app {
    width: 100%;
    max-width: 360px;
    height: calc(100vh - 24px);
    max-height: 700px;
    background: var(--glass-bg);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    position: relative;
    animation: slideUp 0.4s ease;
}

@keyframes slideUp {
    from {
        opacity: 0;
        transform: translateY(30px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* Header */
.chat-header {
    background: linear-gradient(135deg, rgba(67, 97, 238, 0.8), rgba(58, 12, 163, 0.8));
    backdrop-filter: blur(10px);
    color: white;
    padding: 16px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    position: relative;
}

.header-content {
    display: flex;
    align-items: center;
    gap: 10px;
}

.logo {
    width: 36px;
    height: 36px;
    background: rgba(255, 255, 255, 0.2);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    border: 1px solid rgba(255, 255, 255, 0.3);
}

.title-section {
    flex: 1;
}

.title-section h1 {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 2px;
}

.title-section p {
    font-size: 11px;
    opacity: 0.9;
}

.notification-badge {
    width: 24px;
    height: 24px;
    background: var(--danger);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 600;
    opacity: 0;
    transform: scale(0);
    transition: var(--transition);
}

.notification-badge.active {
    opacity: 1;
    transform: scale(1);
}

/* Messages Container */
.messages-container {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    scroll-behavior: smooth;
}

.messages-container::-webkit-scrollbar {
    width: 4px;
}

.messages-container::-webkit-scrollbar-track {
    background: transparent;
}

.messages-container::-webkit-scrollbar-thumb {
    background: rgba(0, 0, 0, 0.1);
    border-radius: 2px;
}

.messages-container::-webkit-scrollbar-thumb:hover {
    background: rgba(0, 0, 0, 0.15);
}

/* Message Bubble */
.message {
    display: flex;
    margin-bottom: 6px;
    animation: messageSlideIn 0.3s ease;
    font-size: 13px;
}

@keyframes messageSlideIn {
    from {
        opacity: 0;
        transform: translateY(10px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.message.user {
    justify-content: flex-end;
}

.message.admin {
    justify-content: flex-start;
}

.message-content {
    max-width: 75%;
    padding: 10px 12px;
    border-radius: 12px;
    word-wrap: break-word;
    line-height: 1.4;
    box-shadow: var(--shadow-sm);
}

.message.user .message-content {
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: white;
    border-radius: 12px 4px 12px 12px;
}

.message.admin .message-content {
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    color: var(--dark);
    border-radius: 4px 12px 12px 12px;
}

.message-content.image {
    padding: 6px;
    border-radius: 10px;
}

.message-content img {
    max-width: 100%;
    border-radius: 8px;
    max-height: 180px;
}

.message-time {
    font-size: 10px;
    opacity: 0.6;
    margin-top: 4px;
    padding: 0 12px;
}

.auto-reply-badge {
    font-size: 9px;
    opacity: 0.7;
    font-style: italic;
    margin-top: 3px;
}

/* Input Area */
.input-area {
    border-top: 1px solid rgba(0, 0, 0, 0.05);
    padding: 12px;
    background: rgba(255, 255, 255, 0.5);
    backdrop-filter: blur(10px);
    display: flex;
    gap: 8px;
    align-items: flex-end;
}

.input-group {
    flex: 1;
    display: flex;
    gap: 8px;
    align-items: flex-end;
}

.message-input {
    flex: 1;
    padding: 10px 12px;
    border: 1px solid var(--glass-border);
    border-radius: var(--radius-sm);
    background: rgba(255, 255, 255, 0.8);
    font-family: inherit;
    font-size: 13px;
    resize: none;
    max-height: 100px;
    transition: var(--transition);
    backdrop-filter: blur(10px);
}

.message-input:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.1);
    background: white;
}

.message-input::placeholder {
    color: var(--gray);
    font-size: 12px;
}

.button-group {
    display: flex;
    gap: 6px;
}

.input-btn {
    width: 36px;
    height: 36px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: white;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    transition: var(--transition);
    box-shadow: var(--shadow-sm);
}

.input-btn:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow);
}

.input-btn:active {
    transform: translateY(0);
}

.input-btn.secondary {
    background: rgba(255, 255, 255, 0.6);
    color: var(--primary);
    border: 1px solid var(--glass-border);
}

.input-btn.secondary:hover {
    background: rgba(255, 255, 255, 0.8);
}

/* Status Indicator */
.status-indicator {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--danger);
    margin-left: 8px;
    animation: pulse 2s infinite;
}

.status-indicator.connected {
    background: var(--success);
}

@keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
}

/* Loading */
.loading-dots {
    display: flex;
    gap: 3px;
}

.loading-dots span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: currentColor;
    opacity: 0.4;
    animation: bounce 1.4s infinite;
}

.loading-dots span:nth-child(2) {
    animation-delay: 0.2s;
}

.loading-dots span:nth-child(3) {
    animation-delay: 0.4s;
}

@keyframes bounce {
    0%, 80%, 100% { transform: scale(1); }
    40% { transform: scale(1.2); }
}

/* Empty State */
.empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    padding: 20px;
    text-align: center;
    color: var(--gray);
}

.empty-state i {
    font-size: 48px;
    margin-bottom: 12px;
    opacity: 0.3;
}

.empty-state h3 {
    font-size: 14px;
    margin-bottom: 6px;
    font-weight: 600;
}

.empty-state p {
    font-size: 12px;
    opacity: 0.7;
}

/* File Input */
#imageInput {
    display: none;
}

/* Responsive */
@media (max-width: 480px) {
    .chat-app {
        max-width: 100%;
        max-height: 100%;
    }
    
    .message-content {
        max-width: 85%;
        font-size: 12px;
    }
}

/* Animation */
@keyframes fadeIn {
    from {
        opacity: 0;
    }
    to {
        opacity: 1;
    }
}

.fade-in {
    animation: fadeIn 0.3s ease;
}
</style>
</head>
<body>
<div class="chat-app">
    <!-- Header -->
    <div class="chat-header">
        <div class="header-content">
            <div class="logo">💬</div>
            <div class="title-section">
                <h1>Flexia Support</h1>
                <p id="status" class="fade-in">Connecting...</p>
            </div>
            <div class="notification-badge" id="notificationBadge">
                <span id="notificationCount">1</span>
            </div>
        </div>
    </div>

    <!-- Messages Container -->
    <div class="messages-container" id="messagesContainer">
        <div class="empty-state">
            <i class="fas fa-message"></i>
            <h3>Start a conversation</h3>
            <p>Send us a message and we'll get back to you shortly</p>
        </div>
    </div>

    <!-- Input Area -->
    <div class="input-area">
        <div class="input-group">
            <input 
                type="text" 
                class="message-input" 
                id="messageInput" 
                placeholder="Type a message..."
                autocomplete="off"
            >
            <button class="input-btn secondary" id="imageBtn" title="Send image">
                <i class="fas fa-image"></i>
            </button>
        </div>
        <button class="input-btn" id="sendBtn" title="Send message">
            <i class="fas fa-paper-plane"></i>
        </button>
    </div>
</div>

<input type="file" id="imageInput" accept="image/*">

<script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
<script>
    // Initialize app
    const socket = io();
    let deviceId = localStorage.getItem('deviceId') || generateUUID();
    let messageCount = 0;
    let isConnected = false;

    // Request notification permission
    if ('Notification' in window && Notification.permission === 'default') {
        Notification.requestPermission();
    }

    function generateUUID() {
        return 'device-' + Math.random().toString(36).substr(2, 9);
    }

    function saveDeviceId() {
        localStorage.setItem('deviceId', deviceId);
    }

    // Socket Events
    socket.on('connect', () => {
        console.log('✅ Connected to server');
        isConnected = true;
        updateStatus('Connected', true);
        socket.emit('join', { device_id: deviceId, username: 'User' });
        saveDeviceId();
    });

    socket.on('disconnect', () => {
        console.log('❌ Disconnected from server');
        isConnected = false;
        updateStatus('Disconnected', false);
    });

    socket.on('user_data', (data) => {
        deviceId = data.device_id;
        saveDeviceId();
        console.log('👤 User data:', data);
    });

    socket.on('receive_message', (data) => {
        displayMessage(data);
        
        // Show notification for admin messages
        if (data.is_admin && Notification.permission === 'granted') {
            new Notification('Flexia Support', {
                body: data.message.substring(0, 100),
                icon: '💬',
                tag: 'flexia-chat',
                requireInteraction: false
            });
        }
    });

    socket.on('error', (error) => {
        console.error('❌ Error:', error);
        showToast(error.message, 'error');
    });

    socket.on('heartbeat_ack', () => {
        console.log('💓 Heartbeat acknowledged');
    });

    // UI Functions
    function updateStatus(text, connected) {
        const statusEl = document.getElementById('status');
        const indicator = statusEl.querySelector?.('.status-indicator') || 
                         document.createElement('div');
        statusEl.textContent = text;
        statusEl.className = 'fade-in';
    }

    function displayMessage(data) {
        const container = document.getElementById('messagesContainer');
        
        // Remove empty state
        const emptyState = container.querySelector('.empty-state');
        if (emptyState) emptyState.remove();

        const messageEl = document.createElement('div');
        messageEl.className = `message ${data.is_admin ? 'admin' : 'user'}`;

        let contentHTML = '';
        if (data.type === 'image') {
            contentHTML = `<div class="message-content image">
                <img src="${data.message}" alt="Image" loading="lazy">
            </div>`;
        } else {
            contentHTML = `<div class="message-content">
                ${escapeHtml(data.message)}
                ${data.is_auto_reply ? '<div class="auto-reply-badge">Auto-reply</div>' : ''}
            </div>`;
        }

        const timeStr = new Date(data.timestamp).toLocaleTimeString('en-US', {
            hour: '2-digit',
            minute: '2-digit'
        });

        messageEl.innerHTML = contentHTML + `<div class="message-time">${timeStr}</div>`;
        container.appendChild(messageEl);
        
        // Scroll to bottom
        container.scrollTop = container.scrollHeight;
        messageCount++;
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    function showToast(message, type = 'info') {
        console.log(`[${type.toUpperCase()}] ${message}`);
        // You can add a toast UI here
    }

    // Event Listeners
    const sendBtn = document.getElementById('sendBtn');
    const messageInput = document.getElementById('messageInput');
    const imageBtn = document.getElementById('imageBtn');
    const imageInput = document.getElementById('imageInput');

    sendBtn.addEventListener('click', sendMessage);
    messageInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });

    imageBtn.addEventListener('click', () => imageInput.click());
    imageInput.addEventListener('change', handleImageUpload);

    function sendMessage() {
        const message = messageInput.value.trim();
        if (!message) return;

        socket.emit('send_message', {
            device_id: deviceId,
            sender: 'User',
            message: message,
            type: 'text'
        });

        messageInput.value = '';
        messageInput.style.height = 'auto';
    }

    function handleImageUpload(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
            socket.emit('upload_image', {
                device_id: deviceId,
                image_data: event.target.result,
                is_admin: false
            });
            imageInput.value = '';
        };
        reader.readAsDataURL(file);
    }

    // Auto-resize textarea
    messageInput.addEventListener('input', () => {
        messageInput.style.height = 'auto';
        messageInput.style.height = Math.min(messageInput.scrollHeight, 100) + 'px';
    });

    // Heartbeat to keep connection alive
    setInterval(() => {
        if (isConnected) {
            socket.emit('heartbeat', { device_id: deviceId });
        }
    }, 30000);

    // Load messages on startup (optional - commented out as server stores them)
    console.log('🚀 Chat app initialized');
</script>
</body>
</html>
